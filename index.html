<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
</html>
</head>

    <head>
        <link rel="stylesheet" href="style.css">
      </head>
      

<html>
<body>

    <div class="container">
        <h1>Cadastro de Funcionários</h1>
        <div class="titulo"></div>
        <form>
            <label for="nome">Nome completo:</label>
            <input type="text" maxlength="50" id="nome" name="nome" placeholder="Digite o nome" required>

            <label for="cpf">CPF:</label>
            <input type="text" maxlength="14" id="cpf" name="cpf" placeholder="Digite o CPF" required>

            <label for="email">E-mail:</label>
            <input type="email" maxlength="244" id="email" name="email" placeholder="Digite o e-mail" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" maxlength="14" id="telefone" name="telefone" placeholder="Digite o telefone">

            <label for="cargo">Cargo:</label>
            <select id="cargo" name="cargo">
                <option value="">Selecione um cargo</option>
                <option value="gerente">Gerente</option>
                <option value="vendedor">Vendedor</option>
                <option value="administrativo">Administrativo</option>
                <option value="estagiario">Estagiário</option>
                <option value="entregador">Entregador</option>
                <option value="senior">Senoir</option>
                <option value="jovem aprendiz">Jovem Aprendiz</option>
            </select>

            <label for="salario">Salário:</label>
            <input type="number" id="salario" name="salario" step="0.01" placeholder="Digite o salário">

            <label for="admissao">Data de admissão:</label>
            <input type="date" id="admissao" name="admissao">

            <button type="submit">Cadastrar Funcionário</button>
        </form>
    </div>

</body>
</html>
